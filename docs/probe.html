<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>probe</title>
<style>
  html,body{margin:0;padding:0;background:#fff;color:#000}
  body{font-family:Georgia,serif;font-size:22px;padding:28px;-webkit-text-size-adjust:100%}
  h1{font-size:34px;margin:0 0 10px 0}
  pre{font-family:"Courier New",monospace;font-size:20px;line-height:1.45;
      white-space:pre-wrap;word-wrap:break-word;background:#eee;
      border:1px solid #000;padding:14px;margin:0}
  p{font-size:17px;color:#555}
</style>
</head>
<body>
<h1>Kindle capability probe</h1>
<pre id="out">running...</pre>
<p>Type back every line. "YES/no" is real presence; "[type]" is what the
browser actually exposes &mdash; that's the unambiguous part.</p>

<script>
/* ES5. Render as plain text in a <pre> via a text node: the most robust
   path on ancient WebKit (no innerHTML-into-<table> fragment quirks). */
function present(v){ return (typeof v !== "undefined") && v !== null && v !== false; }

var lines = [];
lines.push("user-agent:");
lines.push("  " + (navigator.userAgent || "(none)"));
lines.push("");

function row(name, val){
  lines.push((present(val) ? "YES " : " no ") + name + "  [" + (typeof val) + "]");
}

row("XMLHttpRequest", window.XMLHttpRequest);
row("fetch",          window.fetch);
row("Promise",        window.Promise);
row("WebSocket",      window.WebSocket || window.MozWebSocket);
row("EventSource",    window.EventSource);
row("RTCPeerConnection", window.RTCPeerConnection || window.webkitRTCPeerConnection || window.mozRTCPeerConnection);
row("JSON.parse",     (window.JSON && JSON.parse));
row("localStorage",   window.localStorage);
row("addEventListener", window.addEventListener);
row("querySelector",  document.querySelector);
row("onLine",         (("onLine" in navigator) ? navigator.onLine : undefined));

var out = document.getElementById("out");
while (out.firstChild) { out.removeChild(out.firstChild); }
out.appendChild(document.createTextNode(lines.join("\n")));
</script>
</body>
</html>
