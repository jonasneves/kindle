<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>probe v3 — transport</title>
<style>
  html,body{margin:0;padding:0;background:#fff;color:#000}
  body{font-family:Georgia,serif;font-size:22px;padding:24px;-webkit-text-size-adjust:100%}
  h1{font-size:30px;margin:0 0 8px 0}
  pre{font-family:"Courier New",monospace;font-size:19px;line-height:1.6;
      white-space:pre-wrap;word-wrap:break-word;background:#eee;
      border:1px solid #000;padding:14px;margin:0}
  p{font-size:16px;color:#555}
</style>
</head>
<body>
<h1>probe v3 — signaling + NAT</h1>
<pre id="out">testing... (wait ~12s)</pre>
<p>Only two questions left: is WebSocket really dead, and does STUN give a
srflx candidate. Type back the WS line and the ICE line.</p>

<script>
var S = { ws_events:"...", ws_postman:"...", ice:"...(gathering 10s)" };
function render(){
  document.getElementById("out").textContent = [
    "WS echo.websocket.events : " + S.ws_events,
    "WS ws.postman-echo.com   : " + S.ws_postman,
    "",
    "ICE candidate types seen : " + S.ice
  ].join("\n");
}
render();

/* ---- WebSocket on two independent endpoints (disambiguate the earlier fail) ---- */
function testWS(key, url){
  try {
    var ws = new WebSocket(url);
    var t = setTimeout(function(){ S[key]="TIMEOUT(no open 10s)"; render(); try{ws.close();}catch(_){} }, 10000);
    ws.onopen    = function(){ S[key]="OPEN"; render(); try{ws.send("ping");}catch(_){} };
    ws.onmessage = function(m){ clearTimeout(t); S[key]="OK echo:"+String(m.data).slice(0,16); render(); try{ws.close();}catch(_){} };
    ws.onerror   = function(){ clearTimeout(t); S[key]="ERROR"; render(); };
  } catch(e){ S[key]="THROW:"+e; render(); }
}
testWS("ws_events",  "wss://echo.websocket.events");
testWS("ws_postman", "wss://ws.postman-echo.com/raw");

/* ---- WebRTC: gather ALL candidates for 10s, report the set of types ---- */
try {
  var pc = new (window.RTCPeerConnection||window.webkitRTCPeerConnection)(
    { iceServers:[{ urls:"stun:stun.l.google.com:19302" }] });
  pc.createDataChannel("probe");
  var types = {};
  function note(t){ if(t && !types[t]){ types[t]=1; S.ice=keys(types); render(); } }
  function keys(o){ var a=[]; for(var k in o){ if(o.hasOwnProperty(k)) a.push(k);} return a.join(", ") || "(none)"; }
  pc.onicecandidate = function(e){
    if(e.candidate){
      var t = e.candidate.type;                       // modern engines expose .type
      if(!t){ var m=(""+e.candidate.candidate).match(/ typ (\w+)/); t = m && m[1]; }
      note(t);
    }
  };
  pc.createOffer().then(function(o){ return pc.setLocalDescription(o); })
    .catch(function(err){ S.ice="FAIL:"+err; render(); });
  setTimeout(function(){ if(S.ice.indexOf("gathering")>-1) S.ice="(none in 10s)"; render(); }, 10500);
} catch(e){ S.ice="THROW:"+e; render(); }
</script>
</body>
</html>
