<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>probe v2 — functional</title>
<style>
  html,body{margin:0;padding:0;background:#fff;color:#000}
  body{font-family:Georgia,serif;font-size:21px;padding:24px;-webkit-text-size-adjust:100%}
  h1{font-size:30px;margin:0 0 8px 0}
  pre{font-family:"Courier New",monospace;font-size:18px;line-height:1.5;
      white-space:pre-wrap;word-wrap:break-word;background:#eee;
      border:1px solid #000;padding:14px;margin:0}
  p{font-size:16px;color:#555}
</style>
</head>
<!-- ES-module execution test: if the engine runs this, it flips the flag. -->
<script type="module">window.__esm_module_ran = true;</script>
<body>
<h1>probe v2 — does it actually work?</h1>
<pre id="out">starting tests...</pre>
<p>These EXERCISE each API (not just check it exists). Wait ~10s for all
lines to settle, then type them back. The WebRTC + module lines decide
whether the radchat/ccw stack can run here.</p>

<script>
var S = {
  ua:        navigator.userAgent || "(none)",
  module:    "...testing <script type=module>",
  dimport:   "...testing dynamic import()",
  webrtc:    "...testing RTCPeerConnection + ICE",
  ws:        "...testing WebSocket (wss echo)",
  fetchcors: "...testing fetch() + CORS"
};
function render(){
  var L = [
    "user-agent:",
    "  " + S.ua, "",
    "[module ] " + S.module,
    "[import ] " + S.dimport,
    "[webrtc ] " + S.webrtc,
    "[websock] " + S.ws,
    "[fetch  ] " + S.fetchcors
  ];
  var o = document.getElementById("out");
  o.textContent = L.join("\n");
}
function set(k, v){ S[k] = v; render(); }
render();

/* 1. ES module execution (deferred — check shortly after parse) */
setTimeout(function(){
  set("module", window.__esm_module_ran ? "YES — <script type=module> executed"
                                        : "NO — type=module did NOT run");
}, 600);

/* 2. dynamic import() — wrap in Function so a parse error can't kill the page */
try {
  var dynImport = new Function("u", "return import(u)");
  dynImport("data:text/javascript,export default 42")
    .then(function(m){ set("dimport", "YES — dynamic import() works (got " + m.default + ")"); })
    .catch(function(e){ set("dimport", "NO — import() rejected: " + e); });
} catch (e) {
  set("dimport", "NO — import() is a syntax error here");
}

/* 3. WebRTC: construct, open a data channel, gather an ICE candidate */
try {
  var pc = new (window.RTCPeerConnection || window.webkitRTCPeerConnection)(
    { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
  pc.createDataChannel("probe");
  var gotCand = false;
  pc.onicecandidate = function(e){
    if (e.candidate && !gotCand) {
      gotCand = true;
      var parts = ("" + e.candidate.candidate).split(" ");
      set("webrtc", "YES — data channel + ICE candidate (" + (parts[7] || parts[4] || "?") + ")");
    }
  };
  pc.createOffer().then(function(o){ return pc.setLocalDescription(o); })
    .then(function(){ if (!gotCand) set("webrtc", "offer created, gathering ICE..."); })
    .catch(function(err){ set("webrtc", "FAIL createOffer: " + err); });
  setTimeout(function(){ if (!gotCand) set("webrtc", "API works but NO ICE in 9s (UDP blocked?)"); }, 9000);
} catch (e) {
  set("webrtc", "FAIL construct: " + e);
}

/* 4. WebSocket: connect to an echo server, send + receive */
try {
  var ws = new WebSocket("wss://echo.websocket.events");
  var wt = setTimeout(function(){ set("ws", "TIMEOUT — no open in 9s"); try{ws.close();}catch(_){} }, 9000);
  ws.onopen    = function(){ set("ws", "open — sending..."); try{ws.send("ping");}catch(_){} };
  ws.onmessage = function(m){ clearTimeout(wt); set("ws", "YES — echo: " + String(m.data).slice(0, 24)); try{ws.close();}catch(_){} };
  ws.onerror   = function(){ clearTimeout(wt); set("ws", "ERROR — connection failed"); };
} catch (e) {
  set("ws", "FAIL: " + e);
}

/* 5. fetch() + cross-origin CORS */
try {
  fetch("https://api.github.com/zen", { mode: "cors" })
    .then(function(r){ return r.text(); })
    .then(function(t){ set("fetchcors", 'YES — CORS ok: "' + t.slice(0, 28) + '"'); })
    .catch(function(e){ set("fetchcors", "FAIL: " + e); });
} catch (e) {
  set("fetchcors", "FAIL: " + e);
}
</script>
</body>
</html>
