<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kindle</title>
<style>
  /* e-ink: pure black on white, big serif, block layout only (no flex/grid) */
  html, body { margin: 0; padding: 0; background: #fff; color: #000; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 26px;
    line-height: 1.5;
    padding: 40px;
    -webkit-text-size-adjust: 100%;
  }
  h1 { font-size: 44px; margin: 0 0 8px 0; }
  .muted { color: #555; }
  hr { border: 0; border-top: 2px solid #000; margin: 28px 0; }
  .clock { font-size: 64px; font-weight: bold; margin: 12px 0; }
  .date { font-size: 30px; }
  .foot { font-size: 20px; margin-top: 40px; }
</style>
</head>
<body>
  <h1>It works.</h1>
  <p class="muted">Served from GitHub Pages to the Kindle browser.</p>

  <hr>

  <div class="clock" id="clock">--:--</div>
  <div class="date" id="date">&nbsp;</div>

  <p class="foot muted">
    neves.cloud/kindle &middot; refreshes every 60s
  </p>

<script>
  // ES5-only. Old WebKit on Kindle does not guarantee ES6.
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function render() {
    var d = new Date();
    var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    document.getElementById('clock').firstChild.nodeValue =
      pad(d.getHours()) + ':' + pad(d.getMinutes());
    document.getElementById('date').firstChild.nodeValue =
      days[d.getDay()] + ' ' + d.getDate() + ' ' + mon[d.getMonth()] + ' ' + d.getFullYear();
  }
  render();
  // Full reload once a minute: forces a clean e-ink repaint instead of
  // ghosty partial DOM updates, and picks up any new deploy.
  setTimeout(function () { window.location.reload(true); }, 60000);
</script>
</body>
</html>
