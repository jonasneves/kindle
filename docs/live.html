<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>live · kindle</title>
<style>
  html,body{margin:0;padding:0;background:#fff;color:#000}
  body{font-family:Georgia,"Times New Roman",serif;font-size:26px;line-height:1.55;
       padding:34px;-webkit-text-size-adjust:100%}
  #bar{position:fixed;top:0;left:0;right:0;background:#000;color:#fff;
       font-family:"Courier New",monospace;font-size:15px;padding:6px 10px;
       display:flex;justify-content:space-between}
  #bar a{color:#fff}
  #view{margin-top:40px}
  #view h1,#view h2,#view h3{line-height:1.2;margin:.4em 0 .3em}
  #view p{margin:0 0 1em 0}
  #view img{max-width:100%;height:auto}
  .muted{color:#666}
</style>
</head>
<body>
<div id="bar"><span id="barstatus">connecting…</span><a href="./?app=reader">read</a></div>
<article id="view">
  <p class="muted">Waiting for a cast. On your computer open
  <b>neves.cloud/kindle/cast.html</b> and start typing — or run the bookmarklet
  on any tab. Leave this page open; it updates live.</p>
</article>

<!-- Classic script: ES2017-safe, NO optional chaining. Surfaces every failure
     to the bar so a load error is never silent again. -->
<script>
(function () {
  var SITE_ID = "kindle-" + (new URL(location).searchParams.get("s") || "live");
  var statusEl = document.getElementById("barstatus");
  var view = document.getElementById("view");
  function setbar(t) { statusEl.textContent = t; }
  function show(html) { view.innerHTML = html || '<p class="muted">(empty)</p>'; }

  window.addEventListener("error", function (e) { setbar("load error: " + (e.message || "?")); });
  window.addEventListener("unhandledrejection", function (e) {
    var r = e.reason; setbar("error: " + ((r && r.message) || r || "?"));
  });

  setbar("loading…");
  // Dynamic import via Function so any parse/load error is catchable (not silent).
  var imp = new Function("u", "return import(u);");
  imp("./vendor/transport.kindle.js").then(function (mod) {
    var join = mod.join;
    var last = null, connecting = false, stopped = false;

    function connect() {
      if (connecting) return;
      connecting = true;
      setbar("pairing · " + SITE_ID + " …");
      join({ siteId: SITE_ID }).then(function (session) {
        session.onMessage(function (msg) {
          if (msg && msg.kind === "content") {
            if (msg.html !== last) { last = msg.html; show(msg.html); }
            setbar("● live · " + SITE_ID);
          }
        });
        session.onClose(function () {
          connecting = false;
          setbar("caster left · reconnecting…");
          if (!stopped) setTimeout(connect, 2500);
        });
        return session.ready.then(function () {
          setbar("connected · " + SITE_ID + " · waiting for content");
        });
      }).catch(function (err) {
        connecting = false;
        setbar("no caster yet · retrying… (" + ((err && err.message) || err) + ")");
        if (!stopped) setTimeout(connect, 3000);
      });
    }
    connect();
  }).catch(function (err) {
    setbar("transport load FAILED: " + ((err && err.message) || err));
  });
})();
</script>
</body>
</html>
